name: Export MISP DDoS Events

on:
  # Run every 5 minutes (maximum frequency allowed by GitHub Actions)
  schedule:
    - cron: '*/5 * * * *'
  
  # Allow manual triggering
  workflow_dispatch:
  
  # Optional: Run on push to main (for testing)
  # push:
  #   branches:
  #     - main

jobs:
  export-events:
    name: Export DDoS Events from MISP
    # Option 1: Use any self-hosted runner
    runs-on: self-hosted
    
    # Option 2: Use self-hosted runner with specific label (recommended)
    # runs-on: [self-hosted, misp-runner]
    
    # Grant write permissions to push changes
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Debug - Check script and environment
        run: |
          echo "Checking export_misp_events.py __init__ method:"
          grep -A 5 "def __init__" export_misp_events.py
          echo ""
          echo "MISP_VERIFY_SSL will be set to: false"
      
      - name: Export MISP events
        env:
          MISP_URL: ${{ secrets.MISP_URL }}
          MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
          OUTPUT_FILE: ddos_events.json
          MISP_VERIFY_SSL: 'false'  # Set to 'true' if using valid SSL certificate
        run: |
          echo "Environment check:"
          echo "MISP_VERIFY_SSL=$MISP_VERIFY_SSL"
          python export_misp_events.py
          
          # Verify file was created
          if [ -f ddos_events.json ]; then
            echo "✅ ddos_events.json was created successfully"
            ls -lh ddos_events.json
          else
            echo "❌ ddos_events.json was NOT created"
            exit 1
          fi
      
      - name: Check for changes
        id: check_changes
        run: |
          # Add the file to git first to track it
          git add ddos_events.json
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected, will commit"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # File is already added in previous step, just commit
          
          # Get event count from JSON
          EVENT_COUNT=$(python -c "import json; data=json.load(open('ddos_events.json')); print(data['export_metadata']['total_events'])")
          
          git commit -m "Update DDoS events data - ${EVENT_COUNT} events [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push
      
      - name: Create job summary
        if: always()
        run: |
          echo "## MISP DDoS Events Export Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f ddos_events.json ]; then
            EVENT_COUNT=$(python -c "import json; data=json.load(open('ddos_events.json')); print(data['export_metadata']['total_events'])")
            EXPORT_DATE=$(python -c "import json; data=json.load(open('ddos_events.json')); print(data['export_metadata']['export_date'])")
            
            echo "✅ **Export Status**: Success" >> $GITHUB_STEP_SUMMARY
            echo "📊 **Total Events Exported**: ${EVENT_COUNT}" >> $GITHUB_STEP_SUMMARY
            echo "📅 **Export Date**: ${EXPORT_DATE}" >> $GITHUB_STEP_SUMMARY
            echo "🔒 **TLP Levels**: GREEN, CLEAR" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
              echo "✏️ **Changes**: New data committed to repository" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ **Changes**: No changes detected" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Export Status**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **JSON File**: [ddos_events.json](https://github.com/${{ github.repository }}/blob/main/ddos_events.json)" >> $GITHUB_STEP_SUMMARY
          echo "📡 **Raw Data URL**: \`https://raw.githubusercontent.com/${{ github.repository }}/main/ddos_events.json\`" >> $GITHUB_STEP_SUMMARY
